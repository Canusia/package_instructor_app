{% comment %}
Fallback Course Administrators table (package_instructor_app#2), used only
when the tenant's myce_tenant_configs has no faculty_coords_by_course variant.
Context: table_id, api_url, details_prefix.
{% endcomment %}
<table id="{{ table_id }}" class="table table-striped responsive"
    style="width:100%">
    <thead>
        <tr>
            <th data-data="course.name" data-name="course.name">Course</th>
            <th data-data="user.last_name" data-name="user.last_name">Last Name
            <th data-data="user.first_name" data-name="user.first_name">First Name
            </th>
            <th data-data="user.email" data-name="user.email">Email
            </th>
            <th data-data="role" data-name="role">Role
            </th>
            <th data-data="status" data-name="status">Status
            </th>
            <th data-data="id" data-name='id'><span class="sr-only">Actions</span>
            </th>
        </tr>
    </thead>
</table>

<script>
    jQuery(function ($) {
        window['{{ table_id|escapejs }}'] = $('#{{ table_id }}')
           .DataTable({
                dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                buttons: [
                    {
                        extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                        text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                        titleAttr: 'Export results to CSV'
                    },
                    {
                        extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                        text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                        titleAttr: 'Print'
                    },
                ],
                ajax: '{{ api_url|escapejs }}',
                serverSide: true,
                processing: true,
                stateSave: true,
                'lengthMenu': [30, 50, 100],
                'order': [[0, 'asc']],
                'columns': [

                    null,
                    null,
                    null,
                    null,
                    null,
                    null,
                    {
                        'searchable': false,
                        'orderable': false,
                        'render': function (data, type, row, meta) {
                            return "<a class='btn btn-sm btn-primary  record-details' refresh-target='{{ table_id }}' href='" + "{{ details_prefix|escapejs }}" + row.course.id + "#administrators'>View Details</a>"
                        }
                    }
                ]
            }
        );
    });
</script>
